# Rate Limiting Configuration (§7.5)
# Global limit: 300 requests / minute per IP (5 requests / second with burst)
limit_req_zone $binary_remote_addr zone=global_ip_limit:10m rate=300r/m;

# Auth & OTP endpoint limit: 30 requests / minute per IP for brute-force prevention
limit_req_zone $binary_remote_addr zone=auth_ip_limit:10m rate=30r/m;

# Standard 429 Too Many Requests response code for rate limit violations
limit_req_status 429;
