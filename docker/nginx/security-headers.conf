# Security Headers (Architecture §7.8)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(self), camera=(self), microphone=(self), payment=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.neshan.org; font-src 'self'; connect-src 'self' https://api.pishkhan.ir wss://ws.pishkhan.ir https://api.neshan.org; frame-src https://www.zarinpal.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;