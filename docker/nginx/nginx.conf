user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting configuration (§7.5)
    include /etc/nginx/rate-limit.conf;

    # Dynamic Upstream for Blue-Green Deployment
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        include /etc/nginx/security-headers.conf;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Citizen PWA Static Files
        location / {
            root /usr/share/nginx/html/citizen-pwa;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Operator Desk Static Files
        location /desk {
            alias /usr/share/nginx/html/operator-desk;
            index index.html;
            try_files $uri $uri/ /desk/index.html;
        }

        # API Reverse Proxy
        location /api {
            limit_req zone=global_ip_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints with stricter rate limit
        location /api/v1/auth {
            limit_req zone=auth_ip_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}