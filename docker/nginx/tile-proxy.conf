# ==============================================================================
# Neshan Tile Caching Proxy (§8.4)
# 30-Day Caching Reverse Proxy for Map Tiles
# Themes: standard-day, neshan, dreamy
# Upstream: https://api.neshan.org/v4/tiles/raster/{theme}/{z}/{x}/{y}.png
# ==============================================================================

location ~* ^/tiles/(standard-day|neshan|dreamy)/([0-9]+)/([0-9]+)/([0-9]+)\.png$ {
    set $theme $1;
    set $z $2;
    set $x $3;
    set $y $4;

    # Forward to Neshan raster tiles upstream
    proxy_pass https://api.neshan.org/v4/tiles/raster/$theme/$z/$x/$y.png;

    # Inject Neshan API Key server-side (Never exposed to client)
    proxy_set_header Api-Key $neshan_api_key;
    proxy_set_header Host api.neshan.org;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # 30-day cache configuration (§8.4, §4.6)
    proxy_cache tile_cache;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;

    # Cache & content headers
    add_header X-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Content-Type image/png always;

    # Security: Hide upstream auth & cookie headers
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
}
