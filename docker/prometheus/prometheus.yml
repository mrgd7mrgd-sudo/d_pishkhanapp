global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pishkhan-api'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          environment: 'production'
          service: 'pishkhan-api'

  - job_name: 'pishkhan-reverb'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['reverb:8080']
        labels:
          environment: 'production'
          service: 'pishkhan-reverb'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          environment: 'production'
          service: 'pishkhan-loki'
