services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pishkhan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pishkhan}
      POSTGRES_USER: ${POSTGRES_USER:-pishkhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pishkhan} -d ${POSTGRES_DB:-pishkhan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pishkhan_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pishkhan_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pishkhan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secretminio123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: pishkhan_mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: pishkhan_clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverb:
    image: php:8.3-cli-alpine
    container_name: pishkhan_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    volumes:
      - ../apps/api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:randomkey}
      REVERB_APP_ID: ${REVERB_APP_ID:-pishkhan-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-pishkhan-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-pishkhan-reverb-secret}
      REVERB_HOST: ${REVERB_HOST:-0.0.0.0}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_SCALING_ENABLED: "true"
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: pishkhan_postgres_data
  redis_data:
    name: pishkhan_redis_data
  minio_data:
    name: pishkhan_minio_data
  clamav_data:
    name: pishkhan_clamav_data

