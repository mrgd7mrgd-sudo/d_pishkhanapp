name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Blue-Green Staging Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Deployment Protocol
        run: bash scripts/deploy.sh